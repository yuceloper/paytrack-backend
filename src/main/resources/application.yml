spring:
  application:
    name: paytrack-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/paytrack}
    username: ${DB_USERNAME:paytrack}
    password: ${DB_PASSWORD:paytrack}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

paytrack:
  auth:
    jwt-secret: ${JWT_SECRET:paytrack-local-development-secret-change-me-1234567890}
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:60}
    refresh-token-days: ${REFRESH_TOKEN_DAYS:180}

server:
  port: ${PORT:8080}
